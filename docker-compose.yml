# ============================================
# SmartRental - Docker Compose (CHỈ DÙNG CHO DEV LOCAL)
#
# Dùng khi muốn chạy toàn bộ stack trên máy local.
# KHÔNG dùng cho production (production dùng Render + Vercel).
#
# Cách dùng:
#   1. cp .env.example .env  (điền giá trị thật)
#   2. docker compose up --build
#   3. Backend: http://localhost:8080
#   4. Database: localhost:3307
# ============================================

services:
  # Database cho dev
  db:
    image: mariadb:11
    container_name: smartrental-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: smart_rental_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backend (dùng Dockerfile)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartrental-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/smart_rental_db?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8mb4
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      FPT_AI_KEY: ${FPT_AI_KEY:-}

volumes:
  db_data:
    driver: local
