server:
  port: 8080

spring:
  application:
    name: smart-rental
  datasource:
    # URL kết nối MariaDB, lưu ý port 3307

    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

    # Driver chuẩn của MariaDB
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # Tự động cập nhật schema DB khi có thay đổi Entity
      ddl-auto: update
    show-sql: true # Hiển thị câu lệnh SQL trong console
    properties:
      hibernate:
        # Dialect tối ưu cho MariaDB
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true # Format SQL cho dễ đọc

  # Cấu hình upload file (nếu cần dùng sau này)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# --- CẤU HÌNH TÙY CHỈNH ---
# JWT Config (Bắt buộc phải có để chạy JwtTokenProvider)
jwt:
  secret: "${JWT_SECRET:}"
  expiration: 86400000        # 1 ngày
  refreshExpiration: 2592000000 # 30 ngày
cloudinary:
  cloud-name: "${CLOUDINARY_CLOUD_NAME:}"
  api-key: "${CLOUDINARY_API_KEY:}"
  api-secret: "${CLOUDINARY_API_SECRET:}"
# File Storage
file:
  upload-dir: "uploads/"
fpt:
  ai:
    api-key: "${FPT_AI_KEY:}"
    url: "https://api.fpt.ai/vision/idr/vnm"
blockchain:
  rpc-url: "${BLOCKCHAIN_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}"
  # Private Key ví Admin/Chủ hệ thống
  private-key: "${BLOCKCHAIN_PRIVATE_KEY:}"
  fallback-landlord-wallet: "${BLOCKCHAIN_FALLBACK_LANDLORD:0x5B38Da6a701c568545dCfcB03FcB875f56beddC4}"
  fallback-tenant-wallet: "${BLOCKCHAIN_FALLBACK_TENANT:0xAb8483F64d9C6d1EcF9b849Ae677dD3315835cb2}"

  # Chain ID của Sepolia
  chain-id: ${BLOCKCHAIN_CHAIN_ID:11155111}

  # Tỷ giá cố định VND/ETH
  vnd-eth-rate: ${BLOCKCHAIN_VND_ETH_RATE:80000000}
gemini:
  api:
    key: "${GEMINI_API_KEY:}"
jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MariaDBDialect
      format_sql: true
      # --- CẤU HÌNH HIBERNATE ENVERS (THÊM VÀO ĐÂY) ---
      envers:
        # Hậu tố cho bảng audit (VD: users_aud)
        audit_table_suffix: _aud
        # Tên cột lưu ID phiên bản
        revision_field_name: rev
        # Tên cột lưu loại thay đổi (0: ADD, 1: MOD, 2: DEL)
        revision_type_field_name: revtype
        # Luôn lưu dữ liệu kể cả khi xóa
        store_data_at_delete: true
        # Bắt buộc ghi log ngay cả khi các trường không thay đổi giá trị (giúp audit chặt chẽ hơn)
        audit_strategy: org.hibernate.envers.strategy.DefaultAuditStrategy
brevo:
  api:
    key: "${BREVO_API_KEY:}"
  sender:
    email: "${BREVO_SENDER_EMAIL:}"
    name: "${BREVO_SENDER_NAME:SmartRental}"
google:
  client-id: "${GOOGLE_CLIENT_ID:}"
