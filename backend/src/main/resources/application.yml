server:
  port: 8080

spring:
  application:
    name: smart-rental
  datasource:
    url: jdbc:mariadb://localhost:3307/smart_rental_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
