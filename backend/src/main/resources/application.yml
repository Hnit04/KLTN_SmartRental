server:
  port: ${PORT:8080}

spring:
  application:
    name: smart-rental
  datasource:
    # URL kết nối MariaDB, lưu ý port 3307

    url: ${DB_URL:jdbc:postgresql://db.mnuoprhnywzszwoodoz.supabase.co:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:YOUR_SUPABASE_PASSWORD}

    # Driver chuẩn của PostgreSQL
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Tự động cập nhật schema DB khi có thay đổi Entity
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Cấu hình Hibernate Envers (Audit Trail)
        envers:
          audit_table_suffix: _aud
          revision_field_name: rev
          revision_type_field_name: revtype
          store_data_at_delete: true
          audit_strategy: org.hibernate.envers.strategy.DefaultAuditStrategy

  # Cấu hình upload file (nếu cần dùng sau này)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# --- CẤU HÌNH TÙY CHỈNH ---
# JWT Config (Bắt buộc phải có để chạy JwtTokenProvider)
jwt:
  secret: "${JWT_SECRET:}"
  expiration: 86400000        # 1 ngày
  refreshExpiration: 2592000000 # 30 ngày
cloudinary:
  cloud-name: "${CLOUDINARY_CLOUD_NAME:}"
  api-key: "${CLOUDINARY_API_KEY:}"
  api-secret: "${CLOUDINARY_API_SECRET:}"
# File Storage
file:
  upload-dir: "uploads/"
fpt:
  ai:
    api-key: "${FPT_AI_KEY:}"
    url: "https://api.fpt.ai/vision/idr/vnm"
blockchain:
  # Mặc định: Sepolia Testnet. Override bằng biến môi trường nếu cần.
  rpc-url: "${BLOCKCHAIN_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}"
  explorer-url: "${BLOCKCHAIN_EXPLORER_URL:https://sepolia.etherscan.io}"
  # Private Key ví Admin/Chủ hệ thống
  private-key: "${BLOCKCHAIN_PRIVATE_KEY:}"
  fallback-landlord-wallet: "${BLOCKCHAIN_FALLBACK_LANDLORD:0x5B38Da6a701c568545dCfcB03FcB875f56beddC4}"
  fallback-tenant-wallet: "${BLOCKCHAIN_FALLBACK_TENANT:0xAb8483F64d9C6d1EcF9b849Ae677dD3315835cb2}"

  # Chain ID: Sepolia = 11155111
  chain-id: ${BLOCKCHAIN_CHAIN_ID:11155111}

  # Tỷ giá cố định VND/ETH
  vnd-eth-rate: ${BLOCKCHAIN_VND_ETH_RATE:80000000}
gemini:
  api:
    key: "${GEMINI_API_KEY:}"
brevo:
  api:
    key: "${BREVO_API_KEY:}"
  sender:
    email: "${BREVO_SENDER_EMAIL:}"
    name: "${BREVO_SENDER_NAME:SmartRental}"
google:
  client-id: "${GOOGLE_CLIENT_ID:}"

sepay:
  webhook:
    token: "${SEPAY_WEBHOOK_TOKEN:}"
  platform:
    bank-name: "${SEPAY_PLATFORM_BANK_NAME:MB}"
    account-number: "${SEPAY_PLATFORM_ACCOUNT_NUMBER:0326829327}"
    account-name: "${SEPAY_PLATFORM_ACCOUNT_NAME:TRAN CONG TINH}"

---
# === PRODUCTION PROFILE ===
spring:
  config:
    activate:
      on-profile: production
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
